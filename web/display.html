<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Circuit Builder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="topbar">
        <h1 id="brand"><a href="/">Circuit Generator</a></h1>
        <select id="circuit-list"></select>
        <button class="btn" id="load-circuit" onclick="loadSelected()">Load</button>
    </div>

    <!-- One place for every error from the server -->
    <div id="error" class="hidden" role="alert"></div>

    <div id="scroll-col">
        <section id="col-center" class="col">
            <div id="drawing">
                <img id="circuit" alt="Circuit drawing">
                <p id="no-drawing" class="muted">No circuit yet. Add a component below.</p>
            </div>

            <div id="picker">
                <h2>Add a part</h2>
                <div class="row"><span class="label">Type</span><span id="type-buttons"></span></div>

                <div id="part-fields">
                    <div class="row"><span class="label" id="from-label">From</span><span id="from-buttons"></span></div>
                    <div class="row"><span class="label" id="to-label">To</span><span id="to-buttons"></span></div>
                    <div class="row">
                        <span class="label">Value</span>
                        <button class="btn" id="minus" onclick="stepValue(-1)">&minus;</button>
                        <strong id="value-text">&mdash;</strong>
                        <button class="btn" id="plus" onclick="stepValue(1)">+</button>
                        <span id="preset-buttons"></span>
                    </div>
                    <div class="row">
                        <span class="label"></span>
                        <span class="muted">Custom (optional):</span>
                        <input id="custom" type="number" min="0" step="any" style="width: 110px">
                        <span id="custom-unit" class="muted"></span>
                        <button class="btn" onclick="useCustom()">Use</button>
                    </div>
                </div>

                <div id="ground-fields" class="row hidden">
                    <span class="label">Ground</span>
                    Current: <strong id="ground-text">not set</strong>
                    <div class="row">
                        <span class="label">Pick node</span>
                        <span id="ground-buttons"></span>
                    </div>
                </div>

                <div class="row">
                    <span class="label"></span>
                    <button class="btn" id="add" onclick="addPart()">Add</button>
                    <span id="add-hint" class="muted"></span>
                </div>
            </div>
        </section>

        <section id="col-parts" class="col">
            <h2>Parts in the circuit</h2>
            <table>
                <thead><tr><th>ID</th><th>Type</th><th>From</th><th>To</th><th>Value</th><th></th></tr></thead>
                <tbody id="parts"></tbody>
            </table>
            <p><button class="btn" onclick="clearAll()">Clear all</button></p>
        </section>

        <section id="col-calc" class="col">
            <h2>Calculate</h2>
            <ul id="problems"></ul>
            <button class="btn" id="calculate" onclick="calculate()">Calculate</button>
            <div id="results"></div>

            <div id="save-quit-group">
                <div class="row">
                    <span class="label">Name</span>
                    <input id="circuit-name" type="text" style="width: 200px">
                </div>
                <div class="row">
                    <button class="btn" id="save-new" onclick="saveAsNew()">Save as new</button>
                    <button class="btn" id="update-circuit" onclick="updateLoaded()" disabled>Update</button>
                </div>
                <span id="save-status" class="muted"></span>
                <div class="row">
                    <button class="btn" id="quit-app" onclick="quitApp()">Quit</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        //  Constants 
        const TYPES = ["resistor", "capacitor", "inductor", "source", "ground"];
        const TYPE_LABEL = {resistor: "Resistor", capacitor: "Capacitor", inductor: "Inductor", source: "Source", ground: "Ground"};
        const UNIT = {resistor: "Ω", capacitor: "F", inductor: "H", source: "V"};
        const VALUE_FIELD = {resistor: "resistance", capacitor: "capacitance", inductor: "inductance"};
        const PRESETS = {
            resistor: [100, 1e3, 10e3, 100e3],
            capacitor: [100e-9, 1e-6, 10e-6],
            inductor: [1e-3, 10e-3, 100e-3],
            source: [5, 9, 12],
        };
        const NEW = "new";

        // Values the [-] / [+] buttons step through: 1, 2.2, 4.7 in every decade
        const LADDER = [];
        for (let exp = -12; exp <= 9; exp++)
            for (const m of [1, 2.2, 4.7]) LADDER.push(Number((m * 10 ** exp).toPrecision(2)));

        // State 
        let S = null;                                        // last state from the server
        let draft = {type: null, from: null, to: null, value: null, groundNode: null};
        let loadedRecordId = null;                           // record_id of the saved circuit we're editing, if any

        // Talking to the server
        async function api(method, url, body) {
            const opts = {method, headers: {}};
            if (body !== undefined) {
                opts.headers["Content-Type"] = "application/json";
                opts.body = JSON.stringify(body);
            }
            let res, data;
            try {
                res = await fetch(url, opts);
            } catch (e) {
                showError("Could not reach the server: " + e.message);
                return null;
            }
            try {
                data = await res.json();
            } catch (e) {
                // A crash (500) sends an HTML page, not JSON
                data = {error: "Server error " + res.status + " (see the terminal running server.py)"};
            }
            if (!res.ok) {
                showError(data.error || ("Error " + res.status), data.problems);
                return null;
            }
            clearError();
            return data;
        }

        // Every change goes through here: new state, re-render, fresh picture, old results cleared
        async function change(method, url, body) {
            const data = await api(method, url, body);
            if (!data) return false;
            S = data;
            document.getElementById("results").innerHTML = "";
            render();
            refreshImage();
            return true;
        }

        // Errors 
        function showError(message, problems) {
            const box = document.getElementById("error");
            box.textContent = message;
            if (problems && problems.length) {
                const ul = document.createElement("ul");
                for (const p of problems) {
                    const li = document.createElement("li");
                    li.textContent = p;
                    ul.appendChild(li);
                }
                box.appendChild(ul);
            }
            box.classList.remove("hidden");
        }
        function clearError() {
            const box = document.getElementById("error");
            box.textContent = "";
            box.classList.add("hidden");
        }

        // Small helpers 
        const PREFIXES = [[1e9, "G"], [1e6, "M"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "µ"], [1e-9, "n"], [1e-12, "p"]];
        function fmt(value, unit) {
            if (value === null || value === undefined || !Number.isFinite(value)) return "—";
            if (value === 0) return "0 " + unit;
            const abs = Math.abs(value);
            for (const [scale, prefix] of PREFIXES)
                if (abs >= scale * 0.9995) return Number((value / scale).toPrecision(4)) + " " + prefix + unit;
            return value.toExponential(3) + " " + unit;
        }
        function button(text, onClick, {on = false, disabled = false} = {}) {
            const b = document.createElement("button");
            b.className = "btn";
            b.textContent = text;
            b.onclick = onClick;
            b.disabled = disabled;
            if (on) b.classList.add("on");
            return b;
        }
        function nodeNames() {
            return S ? Object.keys(S.nodes) : [];          // already sorted N0, N1, N2, ..., N10
        }
        function isValid(v) { return typeof v === "number" && Number.isFinite(v) && v > 0; }

        // Builder actions 
        function pickType(type) {
            if (type !== "ground" && draft.type !== type) draft.value = PRESETS[type][1] ?? PRESETS[type][0];
            draft.type = type;
            draft.groundNode = null;
            render();
        }
        function pickFrom(node) {
            draft.from = node;
            if (draft.to === node && node !== NEW) draft.to = null;   // can't be the same node
            render();
        }
        function pickTo(node) { draft.to = node; render(); }
        function setValue(v) { draft.value = v; render(); }
        function stepValue(direction) {
            if (!draft.type || draft.type === "ground") return;
            const v = draft.value;
            if (!isValid(v)) { setValue(PRESETS[draft.type][0]); return; }
            const next = direction > 0
                ? LADDER.find(x => x > v * (1 + 1e-9))
                : [...LADDER].reverse().find(x => x < v * (1 - 1e-9));
            if (next !== undefined) setValue(next);
        }
        function useCustom() {
            const v = Number(document.getElementById("custom").value);
            if (!isValid(v)) { showError("Custom value must be a number greater than 0"); return; }
            clearError();
            setValue(v);
        }
        async function addPart() {
            if (draft.type === "ground") {
                if (await change("POST", "/ground", {node: draft.groundNode})) draft.groundNode = null;
                return;
            }
            const ok = await change("POST", "/add/" + draft.type,
                                    {from_node: draft.from, to_node: draft.to, value: draft.value});
            if (ok) { draft.from = null; draft.to = null; render(); }   // keep type and value for the next part
        }

        // Parts list 
        async function removePart(id) { await change("POST", "/remove/" + encodeURIComponent(id)); }
        async function clearAll() {
            if (confirm("Remove every part?")) await change("POST", "/reset");
        }

        // Calculate 
        async function calculate() {
            const data = await api("POST", "/calculate");
            if (data) renderResults(data);
        }
        //  Saved circuits 
        async function refreshCircuitList() {
            const data = await api("GET", "/circuits");
            if (!data) return;
            const select = document.getElementById("circuit-list");
            const previous = select.value;
            select.replaceChildren(...data.circuits.map(c => {
                const opt = document.createElement("option");
                opt.value = c.record_id;
                opt.textContent = c.circuit_name + (c.image_available ? "" : " (no image)");
                return opt;
            }));
            // Keep whichever circuit was selected, or the one we just loaded/saved
            if (data.circuits.some(c => c.record_id === loadedRecordId)) select.value = loadedRecordId;
            else if (data.circuits.some(c => c.record_id === previous)) select.value = previous;
        }

        function applySavedState(data) {
            S = data.state;
            loadedRecordId = S.loaded_record_id;
            document.getElementById("circuit-name").value = data.record.circuit_name;
            render();
            refreshImage();
        }

        async function saveAsNew() {
            const name = document.getElementById("circuit-name").value.trim();
            if (!name) { showError("Give the circuit a name first"); return; }
            const data = await api("POST", "/circuits", {circuit_name: name});
            if (!data) return;
            applySavedState(data);
            await refreshCircuitList();
            document.getElementById("save-status").textContent = "Saved as \"" + data.record.circuit_name + "\"";
        }

        async function loadSelected() {
            const id = document.getElementById("circuit-list").value;
            if (!id) { showError("Pick a saved circuit to load"); return; }
            const data = await api("POST", "/circuits/" + encodeURIComponent(id) + "/load");
            if (!data) return;
            applySavedState(data);
            document.getElementById("save-status").textContent = data.warning || ("Loaded \"" + data.record.circuit_name + "\"");
        }

        async function updateLoaded() {
            if (!loadedRecordId) return;
            const name = document.getElementById("circuit-name").value.trim();
            const body = name ? {circuit_name: name} : {};
            const data = await api("PUT", "/circuits/" + encodeURIComponent(loadedRecordId), body);
            if (!data) return;
            applySavedState(data);
            await refreshCircuitList();
            document.getElementById("save-status").textContent = "Updated \"" + data.record.circuit_name + "\"";
        }

        //  Quit 
        async function quitApp() {
            if (!confirm("Close the application?")) return;
            await api("POST", "/quit");
            document.body.innerHTML = "<p>You can close this tab now.</p>";
        }

        //  Rendering 
        function partsList() {
            // Source first, then components in server order (R1, R2, ..., R10)
            if (!S) return [];
            const rows = [];
            const src = S.circuit.source;
            if (src) rows.push({id: src.source_id, type: "source", from: src.from_node, to: src.to_node,
                                value: src.source_voltage});
            for (const c of S.circuit.components)
                rows.push({id: c.component_id, type: c.component_type, from: c.from_node, to: c.to_node,
                           value: c[VALUE_FIELD[c.component_type]]});
            const order = Object.keys(S.components);
            rows.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
            return rows;
        }

        function renderBuilder() {
            const nodes = nodeNames();
            // Forget picks that point at nodes that no longer exist (after a remove)
            if (draft.from && draft.from !== NEW && !nodes.includes(draft.from)) draft.from = null;
            if (draft.to && draft.to !== NEW && !nodes.includes(draft.to)) draft.to = null;
            if (draft.groundNode && !nodes.includes(draft.groundNode)) draft.groundNode = null;

            const types = document.getElementById("type-buttons");
            types.replaceChildren(...TYPES.map(t => button(TYPE_LABEL[t], () => pickType(t), {on: draft.type === t})));

            const isGround = draft.type === "ground";
            document.getElementById("part-fields").classList.toggle("hidden", isGround);
            document.getElementById("ground-fields").classList.toggle("hidden", !isGround);

            if (isGround) {
                document.getElementById("ground-text").textContent = S && S.ground ? S.ground : "not set";
                document.getElementById("ground-buttons").replaceChildren(
                    ...nodes.map(n => button(n, () => { draft.groundNode = n; render(); }, {on: draft.groundNode === n})));
            } else {
                const isSource = draft.type === "source";
                document.getElementById("from-label").textContent = isSource ? "+ (From)" : "From";
                document.getElementById("to-label").textContent = isSource ? "− (To)" : "To";

                const fromBtns = nodes.map(n => button(n, () => pickFrom(n), {on: draft.from === n}));
                fromBtns.push(button("+ New node", () => pickFrom(NEW), {on: draft.from === NEW}));
                document.getElementById("from-buttons").replaceChildren(...fromBtns);

                // The node picked as From is greyed out in To
                const toBtns = nodes.map(n => button(n, () => pickTo(n), {on: draft.to === n, disabled: n === draft.from}));
                toBtns.push(button("+ New node", () => pickTo(NEW), {on: draft.to === NEW}));
                document.getElementById("to-buttons").replaceChildren(...toBtns);

                const unit = draft.type ? UNIT[draft.type] : "";
                document.getElementById("value-text").textContent = draft.type ? fmt(draft.value, unit) : "—";
                document.getElementById("custom-unit").textContent = unit;
                document.getElementById("minus").disabled = !draft.type;
                document.getElementById("plus").disabled = !draft.type;
                const presets = draft.type
                    ? PRESETS[draft.type].map(v => button(fmt(v, unit), () => setValue(v), {on: draft.value === v}))
                    : [];
                document.getElementById("preset-buttons").replaceChildren(...presets);
            }

            // Block Add until everything is chosen
            const addBtn = document.getElementById("add");
            const hint = document.getElementById("add-hint");
            if (isGround) {
                addBtn.textContent = "Set ground";
                addBtn.disabled = !draft.groundNode;
                hint.textContent = draft.groundNode ? "" : "Pick a node";
            } else {
                addBtn.textContent = "Add";
                const missing = [];
                if (!draft.type) missing.push("a type");
                if (!draft.from) missing.push("a From node");
                if (!draft.to) missing.push("a To node");
                if (!isValid(draft.value)) missing.push("a value");
                addBtn.disabled = missing.length > 0;
                hint.textContent = missing.length ? "Pick " + missing.join(", ") : "";
            }
        }

        function renderParts() {
            const body = document.getElementById("parts");
            const rows = partsList().map(p => {
                const tr = document.createElement("tr");
                for (const text of [p.id, TYPE_LABEL[p.type], p.from, p.to, fmt(p.value, UNIT[p.type])]) {
                    const td = document.createElement("td");
                    td.textContent = text;
                    tr.appendChild(td);
                }
                const td = document.createElement("td");
                td.appendChild(button("Remove", () => removePart(p.id)));
                tr.appendChild(td);
                return tr;
            });
            if (!rows.length) {
                const tr = document.createElement("tr");
                tr.innerHTML = '<td colspan="6" class="muted">Nothing yet</td>';
                rows.push(tr);
            }
            body.replaceChildren(...rows);
        }

        function renderCheck() {
            const problems = S ? S.check.problems : [];
            document.getElementById("problems").replaceChildren(...problems.map(p => {
                const li = document.createElement("li");
                li.textContent = p;
                return li;
            }));
            // Disabled while /check reports problems
            const ready = !!(S && S.check.ok);
            document.getElementById("calculate").disabled = !ready;
            document.getElementById("save-new").disabled = !ready;
            document.getElementById("update-circuit").disabled = !(ready && loadedRecordId);
            if (!ready) document.getElementById("save-status").textContent = "";
        }

        function render() {
            renderBuilder();
            renderParts();
            renderCheck();
        }

        function renderResults(r) {
            let html = "<h3>Node voltages (ground = " + r.ground + ")</h3><table><tr><th>Node</th><th>Voltage</th></tr>";
            for (const [node, v] of Object.entries(r.node_voltages))
                html += "<tr><td>" + node + "</td><td>" + fmt(v, "V") + "</td></tr>";
            html += "</table>";

            html += "<h3>Parts</h3><table><tr><th>ID</th><th>Voltage</th><th>Current</th><th>Power</th></tr>";
            for (const [id, c] of Object.entries(r.components))
                html += "<tr><td>" + id + "</td><td>" + fmt(c.voltage, "V") + "</td><td>" +
                        fmt(c.current, "A") + "</td><td>" + fmt(c.power, "W") + "</td></tr>";
            html += "</table>";
            html += "<p>Power delivered by the source: <strong>" + fmt(r.total_power_delivered, "W") +
                    "</strong>, absorbed by the parts: <strong>" + fmt(r.total_power_absorbed, "W") + "</strong></p>";
            html += '<p class="muted">Signs: voltage = V(From) − V(To), current flows From → To through the part, ' +
                    "power &gt; 0 is absorbed. The source shows negative power because it delivers it.</p>";
            document.getElementById("results").innerHTML = html;
        }

        function refreshImage() {
            const img = document.getElementById("circuit");
            const empty = !S || S.circuit.components.length === 0;   // the server deletes the image then
            img.classList.toggle("hidden", empty);
            document.getElementById("no-drawing").classList.toggle("hidden", !empty);
            // ?t= stops the browser from showing the old cached copy
            if (!empty) img.src = "MyCirc_2.png?t=" + Date.now();
        }
        document.getElementById("circuit").onerror = () => {
            document.getElementById("circuit").classList.add("hidden");
            document.getElementById("no-drawing").classList.remove("hidden");
        };

        // Load whatever the server already has (e.g. after a page refresh)
        (async () => {
            const data = await api("GET", "/state");
            if (data) {
                S = data;
                loadedRecordId = S.loaded_record_id;
                render();
                refreshImage();
            } else render();
            await refreshCircuitList();
        })();
    </script>
</body>
</html>
